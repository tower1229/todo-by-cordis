- insert:
    # 1. GitHub 官方远程 MCP（复用本机环境变量或 gh CLI keyring token）
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js >-
            (() => {
              const token = process.env.GITHUB_PERSONAL_ACCESS_TOKEN
                || process.env.GITHUB_TOKEN
                || require('child_process').execFileSync('/opt/homebrew/bin/gh', ['auth', 'token'], { encoding: 'utf8' }).trim();
              return `Bearer ${token}`;
            })()
        failOnStartupError: false

    # 2. Context7 官方远程 MCP（复用 ~/.cursor/mcp.json 中的 CONTEXT7_API_KEY）
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers:
          CONTEXT7_API_KEY: !!js >-
            (() => {
              if (process.env.CONTEXT7_API_KEY) return process.env.CONTEXT7_API_KEY;
              try {
                const fs = require('fs');
                const os = require('os');
                const path = require('path');
                const cfg = JSON.parse(fs.readFileSync(path.join(os.homedir(), '.cursor', 'mcp.json'), 'utf8'));
                return cfg?.mcpServers?.context7?.headers?.CONTEXT7_API_KEY || '';
              } catch {
                return '';
              }
            })()
        failOnStartupError: false

    # 3. Cloudflare Documentation 官方远程 MCP（免鉴权）
    - id: mcp-cf-docs
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cf_docs
        transport: streamable-http
        url: https://docs.mcp.cloudflare.com/mcp
        failOnStartupError: false

    # 4. Cloudflare Workers Bindings 官方远程 MCP（通过 mcp-remote 走浏览器 OAuth）
    - id: mcp-cf-bindings
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cf_bindings
        transport: stdio
        command: npx
        args: ['-y', 'mcp-remote', 'https://bindings.mcp.cloudflare.com/mcp']
        failOnStartupError: false

    # 5. Cloudflare Observability 官方远程 MCP（通过 mcp-remote 走浏览器 OAuth）
    - id: mcp-cf-observability
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cf_observability
        transport: stdio
        command: npx
        args: ['-y', 'mcp-remote', 'https://observability.mcp.cloudflare.com/mcp']
        failOnStartupError: false
